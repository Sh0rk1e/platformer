<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Pulse Platformer</title>
  <style>
    :root {
      --neon-blue: #00f2ff;
      --neon-pink: #ff0077;
      --neon-green: #00ff88;
      --bg-dark: #050508;
      --panel: rgba(10, 10, 16, 0.9);
    }
    body { margin: 0; overflow: hidden; background: var(--bg-dark); font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    canvas { display: block; }
    .hidden { display: none !important; }

    #ui-layer { position: fixed; inset: 0; pointer-events: none; padding: 20px; box-sizing: border-box; }
    #hud-main { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    #hud-sub { margin-top: 8px; font-size: 14px; color: #a0a0ba; }
    #hud-sub span { margin-right: 12px; }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    #menu { position: fixed; top: 20px; right: 20px; width: 290px; max-height: calc(100vh - 40px); overflow: auto; }
    .menu-title { margin: 0 0 10px 0; font-size: 13px; letter-spacing: 1px; color: #a3a3b7; text-transform: uppercase; }
    .lvl-btn {
      display: block;
      width: 100%;
      margin: 7px 0;
      padding: 11px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #d5d5e3;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .lvl-btn:hover:enabled { background: var(--neon-blue); color: #050508; border-color: var(--neon-blue); }
    .lvl-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #settings { margin-top: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 13px; }
    input[type='range'] { width: 130px; }

    #buttons { margin-top: 10px; display: flex; gap: 8px; }
    .action-btn {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 15;
    }
    #overlay-card {
      min-width: 320px;
      max-width: 540px;
      text-align: center;
      font-size: 18px;
      line-height: 1.4;
    }

    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.45) 100%); }
    #crt { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.12) 50%); background-size: 100% 4px; }

    @media (max-width: 840px) {
      #menu { width: 240px; top: 12px; right: 12px; }
      #ui-layer { padding: 12px; }
      #hud-main { font-size: 18px; }
      #hud-sub { font-size: 12px; }
      .row { font-size: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="vignette"></div>
  <div id="crt"></div>

  <div id="ui-layer">
    <div id="hud-main">Level: <span id="current-lvl-name">Menu</span></div>
    <div id="hud-sub">
      <span>Time <b id="timer">00:00</b></span>
      <span>Deaths <b id="death-count">0</b></span>
      <span>HP <b id="health-count">5/5</b></span>
      <span>Shards <b id="shard-count">0/0</b></span>
      <span>Dash <b id="dash-count">0/100</b></span>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#7f7f95;">Move: WASD/Arrows | Jump: Space | Dash: Shift/K | Pause: Esc | Restart: R</div>
  </div>

  <aside id="menu" class="panel">
    <p class="menu-title">Campaign</p>
    <div id="lvl-list"></div>

    <div id="buttons">
      <button id="pause-btn" class="action-btn">Pause</button>
      <button id="resume-btn" class="action-btn">Resume</button>
      <button id="restart-btn" class="action-btn">Restart</button>
    </div>

    <div id="settings">
      <p class="menu-title">Settings</p>
      <div class="row"><label>Music</label><input id="music-vol" type="range" min="0" max="1" step="0.05"></div>
      <div class="row"><label>SFX</label><input id="sfx-vol" type="range" min="0" max="1" step="0.05"></div>
      <div class="row"><label>Mute</label><input id="mute-toggle" type="checkbox"></div>
      <div class="row"><label>Reduced Shake</label><input id="reduce-shake" type="checkbox"></div>
      <div class="row"><label>High-Contrast Hazards</label><input id="high-contrast" type="checkbox"></div>
    </div>
  </aside>

  <div id="overlay" class="hidden">
    <div id="overlay-card" class="panel">
      <div id="overlay-text"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
