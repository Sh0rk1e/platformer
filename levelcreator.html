<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Architect - Level Editor</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg-dark: #121218;
            --panel: #1e1e26;
        }
        body { 
            margin: 0; background: var(--bg-dark); color: #eee; 
            font-family: 'Segoe UI', system-ui, sans-serif; display: flex; 
            height: 100vh; overflow: hidden;
        }
        #sidebar { 
            width: 300px; background: var(--panel); padding: 25px; 
            border-right: 1px solid rgba(255,255,255,0.1); 
            display: flex; flex-direction: column; gap: 20px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            z-index: 10;
        }
        h2 { margin: 0; font-weight: 800; letter-spacing: 1px; color: var(--accent); }
        .section-label { font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 1.5px; margin-bottom: 5px; }
        
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { 
            padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #ccc; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px rgba(0,242,255,0.3); }
        
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; background: #08080a; }
        canvas { cursor: crosshair; }
        
        .status-bar { 
            position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); 
            padding: 8px 15px; border-radius: 20px; font-size: 12px; color: #888;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        
        .prop-panel { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        input[type="text"], input[type="color"] {
            width: 100%; padding: 8px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box;
        }
        .shortcuts { font-size: 11px; color: #555; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>NEON ARCHITECT</h2>
        
        <div>
            <div class="section-label">Tools</div>
            <div class="tool-grid">
                <button class="btn active" id="btn-plt" onclick="setMode('platforms')">Platform</button>
                <button class="btn" id="btn-haz" onclick="setMode('hazards')">Hazard</button>
                <button class="btn" id="btn-gol" onclick="setMode('goals')">Goal</button>
                <button class="btn" id="btn-sel" onclick="setMode('select')">Select</button>
            </div>
        </div>

        <div class="prop-panel">
            <div class="section-label">Properties</div>
            <div style="margin-bottom: 10px;">
                <label style="display:block; font-size:12px; margin-bottom:5px;">Level Name</label>
                <input type="text" id="lvl-name" value="New Level" onchange="level.levelName = this.value">
            </div>
            <div>
                <label style="display:block; font-size:12px; margin-bottom:5px;">Platform Color</label>
                <input type="color" id="plt-color" value="#333333">
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" style="background: var(--accent); color: #000;" onclick="testLevel()">Test Level</button>
            <button class="btn" style="background: #28a745; color: white;" onclick="downloadJSON()">Export Level</button>
            <button class="btn" style="background: #dc3545; color: white;" onclick="clearLevel()">Clear All</button>
            <div class="shortcuts">
                [Space + Drag] Pan<br>
                [Del / Backspace] Delete Selected<br>
                [Ctrl + Z] Undo<br>
                Snap: 40px
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="editorCanvas"></canvas>
        <div class="status-bar" id="status">Ready</div>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        let level = JSON.parse(localStorage.getItem('neon-edit-save')) || { levelName: "New Level", spawnPoint: {x:80, y:80}, platforms: [], hazards: [], goals: [] };
        let mode = 'platforms';
        
        function saveToLocal() {
            localStorage.setItem('neon-edit-save', JSON.stringify(level));
        }

        let isMouseDown = false;
        let startX, startY;
        let camX = 0, camY = 0;
        let currentRect = null;
        let selectedObj = null;
        let isPanning = false;

        const SNAP = 40;

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            render();
        }
        window.onresize = resize;
        resize();

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            const id = m === 'platforms' ? 'plt' : m === 'hazards' ? 'haz' : m === 'goals' ? 'gol' : 'sel';
            document.getElementById(`btn-${id}`).classList.add('active');
            selectedObj = null;
            render();
        }

        const toWorld = (x, y) => ({ x: x + camX, y: y + camY });
        const snap = v => Math.round(v / SNAP) * SNAP;

        canvas.onmousedown = e => {
            if (e.button === 1 || (e.button === 0 && keys['Space'])) {
                isPanning = true;
                return;
            }

            const world = toWorld(e.offsetX, e.offsetY);
            startX = world.x;
            startY = world.y;
            isMouseDown = true;

            if (mode === 'select') {
                selectedObj = findAt(world.x, world.y);
            } else {
                currentRect = { x: snap(world.x), y: snap(world.y), w: 0, h: 0 };
            }
            render();
        };

        window.onmousemove = e => {
            if (isPanning) {
                camX -= e.movementX;
                camY -= e.movementY;
                render();
                return;
            }

            if (!isMouseDown) return;
            const world = toWorld(e.offsetX, e.offsetY);

            if (mode !== 'select' && currentRect) {
                currentRect.w = snap(world.x) - currentRect.x;
                currentRect.h = snap(world.y) - currentRect.y;
            } else if (mode === 'select' && selectedObj) {
                // Drag logic (optional but nice)
                selectedObj.obj.x = snap(world.x - selectedObj.obj.w/2);
                selectedObj.obj.y = snap(world.y - selectedObj.obj.h/2);
            }
            render();
        };

        window.onmouseup = () => {
            if (isPanning) { isPanning = false; return; }
            if (!isMouseDown) return;
            
            if (mode !== 'select' && currentRect) {
                if (Math.abs(currentRect.w) > 5 && Math.abs(currentRect.h) > 5) {
                    const final = {
                        x: currentRect.w < 0 ? currentRect.x + currentRect.w : currentRect.x,
                        y: currentRect.h < 0 ? currentRect.y + currentRect.h : currentRect.y,
                        w: Math.abs(currentRect.w),
                        h: Math.abs(currentRect.h)
                    };
                    if (mode === 'platforms') final.color = document.getElementById('plt-color').value;
                    level[mode].push(final);
                    saveToLocal();
                }
            }
            
            isMouseDown = false;
            currentRect = null;
            render();
        };

        function findAt(x, y) {
            const types = ['platforms', 'hazards', 'goals'];
            for (const type of types) {
                for (const obj of level[type]) {
                    if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) {
                        return { type, obj };
                    }
                }
            }
            return null;
        }

        const keys = {};
        window.onkeydown = e => {
            keys[e.code] = true;
            if (e.code === 'Delete' || e.code === 'Backspace') {
                if (selectedObj) {
                    level[selectedObj.type] = level[selectedObj.type].filter(o => o !== selectedObj.obj);
                    selectedObj = null;
                    saveToLocal();
                    render();
                }
            }
            if (e.ctrlKey && e.key === 'z') {
                // simple undo for last added
                const types = ['platforms', 'hazards', 'goals'];
                for(let t of types.reverse()) {
                    if(level[t].length > 0) { level[t].pop(); break; }
                }
                saveToLocal();
                render();
            }
        };
        window.onkeyup = e => keys[e.code] = false;

        function render() {
            ctx.fillStyle = '#08080a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#1a1a20';
            ctx.lineWidth = 1;
            const offX = -camX % SNAP;
            const offY = -camY % SNAP;
            for(let x = offX; x < canvas.width; x += SNAP) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = offY; y < canvas.height; y += SNAP) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw level objects
            const drawObj = (obj, color, isHollow = false) => {
                ctx.fillStyle = color;
                ctx.strokeStyle = color;
                if (isHollow) ctx.strokeRect(obj.x - camX, obj.y - camY, obj.w, obj.h);
                else ctx.fillRect(obj.x - camX, obj.y - camY, obj.w, obj.h);
            };

            level.platforms.forEach(p => drawObj(p, p.color || '#333'));
            level.hazards.forEach(h => drawObj(h, '#ff0077'));
            level.goals.forEach(g => drawObj(g, '#00ff88'));

            // Selected highlight
            if (selectedObj) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(selectedObj.obj.x - camX - 2, selectedObj.obj.y - camY - 2, selectedObj.obj.w + 4, selectedObj.obj.h + 4);
            }

            // Ghost / Current
            if (currentRect) {
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(currentRect.x - camX, currentRect.y - camY, currentRect.w, currentRect.h);
                ctx.setLineDash([]);
            }

            // Spawn
            ctx.fillStyle = '#00f2ff';
            ctx.globalAlpha = 0.5;
            ctx.fillRect(level.spawnPoint.x - camX, level.spawnPoint.y - camY, 32, 48);
            ctx.globalAlpha = 1;

            document.getElementById('status').innerText = `Cam: ${Math.round(camX)}, ${Math.round(camY)} | Mode: ${mode.toUpperCase()} | Objects: ${level.platforms.length + level.hazards.length + level.goals.length}`;
        }

        function testLevel() {
            sessionStorage.setItem('neon-test-level', JSON.stringify(level));
            window.location.href = 'index.html?test=true';
        }

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(level, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", level.levelName.toLowerCase().replace(/\s+/g, '-') + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function clearLevel() {
            if(confirm("Clear everything?")) {
                level = { levelName: "New Level", spawnPoint: {x:80, y:80}, platforms: [], hazards: [], goals: [] };
                render();
            }
        }

        render();
    </script>
</body>
</html>
